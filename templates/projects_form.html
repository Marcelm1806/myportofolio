{% extends "base.html" %}

{% block title %}Add project | {{ name }}{% endblock %}

{% block content %}
<section class="content-section" aria-labelledby="project-form-title">
    <div class="container">
        <header class="section-heading">
            <p class="section-kicker">Portfolio</p>
            <h1 id="project-form-title">Add a project</h1>
            <p>Describe the project and your contribution. Required fields are marked *.</p>
        </header>

        <form method="post" action="{% url 'main:create_project' %}" class="project-form">
            {% csrf_token %}

            {% include "components/form_fields.html" %}

            <div class="form-actions">
                <button type="submit" class="button">Save project</button>
                <a href="{% url 'main:show_projects' %}" class="button button-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
