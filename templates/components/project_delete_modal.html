<button
    type="button"
    class="button button-danger"
    popovertarget="delete-project-{{ project.id }}"
    aria-label="Delete project: {{ project.title }}"
>
    Delete
</button>

<div
    id="delete-project-{{ project.id }}"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-labelledby="delete-title-{{ project.id }}"
    aria-describedby="delete-description-{{ project.id }}"
>
    <h2 id="delete-title-{{ project.id }}">Delete project?</h2>
    <p id="delete-description-{{ project.id }}">
        This will permanently remove <strong>{{ project.title }}</strong> from your portfolio.
    </p>

    <div class="project-delete-modal-actions">
        <button
            type="button"
            class="button button-secondary"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            autofocus
        >
            Cancel
        </button>
        <form method="post" action="{% url 'main:delete_project' project.id %}">
            {% csrf_token %}
            <button type="submit" class="button button-danger">Delete project</button>
        </form>
    </div>
</div>
