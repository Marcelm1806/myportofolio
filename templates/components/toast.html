<div id="toast" class="toast" popover="manual" role="status" aria-live="polite" aria-atomic="true">
    <div class="toast-copy">
        <p id="toast-title" class="toast-title"></p>
        <p id="toast-message" class="toast-message"></p>
    </div>
    <button type="button" id="toast-close" class="popover-close" aria-label="Dismiss notification">×</button>
</div>
